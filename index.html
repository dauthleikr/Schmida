<body>
<header class="site-header"><div class="page header-inner"><a class="brand" href="#home" aria-label="Zur Startseite"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 20C8 6 17 7 29 12M3 25C11 12 19 17 29 6M3 28C12 20 18 22 29 17" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span data-content="practiceName"></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menue</button><nav id="site-navigation" aria-label="Hauptnavigation"><ul class="nav-list"></ul></nav></div></header>

</main>
<script>
(()=>{let c=window.practiceContent;try{if(new URLSearchParams(location.search).has('preview'))c=JSON.parse(sessionStorage.getItem('practice-preview-content'))||c}catch{}const get=p=>p.split('.').reduce((v,k)=>v&&v[k],c),formatMarkup=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\n/g,'<br>');document.documentElement.dataset.theme=c.colorTheme||'wine';document.title=c.practiceName;document.querySelectorAll('[data-content]').forEach(e=>e.innerHTML=formatMarkup(get(e.dataset.content)));document.querySelector('.hero-image').alt=`Portraet von ${c.practitionerName}`;document.querySelector('[data-office-alt]').setAttribute('aria-label',c.practice.imageAlt);const links=[['home','#home'],['psychotherapy','#psychotherapy'],['costs','#costs'],['focusAreas','#focus-areas'],['contact','#contact']];document.querySelector('.nav-list').innerHTML=links.map(([n,h])=>`<li><a href="${h}">${formatMarkup(c.navigation[n])}</a></li>`).join('');document.querySelector('[data-list]').innerHTML=c.introduction.items.map(x=>`<li>${formatMarkup(x)}</li>`).join('');document.querySelector('[data-areas]').innerHTML=c.focusAreas.areas.map(([t,x])=>`<article class="focus-card"><h3>${formatMarkup(t)}</h3><p>${formatMarkup(x)}</p></article>`).join('');document.querySelector('[data-prices]').innerHTML=c.costs.entries.map(([n,d,p])=>`<div class="price-row"><div class="price-name"><span>${formatMarkup(n)}</span><span class="price-duration">${formatMarkup(d)}</span></div><div class="price-value">${formatMarkup(p)}</div></div>`).join('');let e=document.querySelector('[data-address]');e.innerHTML=c.contact.address.map(formatMarkup).join('<br>');e=document.querySelector('[data-phone]');e.textContent=c.contact.phoneLabel;e.href=`tel:${c.contact.phoneHref}`;e=document.querySelector('[data-email]');e.textContent=c.contact.email;e.href=`mailto:${c.contact.email}`;e=document.querySelector('[data-map]');e.textContent=c.contact.mapLabel;e.href=c.contact.mapLink;const button=document.querySelector('.menu-toggle'),nav=document.querySelector('.nav-list');button.addEventListener('click',()=>{const open=nav.classList.toggle('is-open');button.setAttribute('aria-expanded',open)});nav.addEventListener('click',()=>{nav.classList.remove('is-open');button.setAttribute('aria-expanded','false')});const wave='<svg viewBox="0 0 1200 180" preserveAspectRatio="none" aria-hidden="true"><g class="ribbon-lines"><g class="ribbon-glow"><path d="M-65 128C122 27 242 183 413 92s279-59 408 19 238 47 449-75" fill="none" stroke="currentColor" stroke-width="42" opacity=".18"/><path d="M-44 113c189 73 288-106 457-20s269 111 408 10 236-28 405-1" fill="none" stroke="currentColor" stroke-width="18" opacity=".16"/></g><g class="ribbon-primary"><path d="M-54 126C138 36 248 169 410 95s266-56 405 17 231 43 439-71" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M-35 114c178 60 276-99 439-27s267 105 403 17 236-41 415 2" fill="none" stroke="currentColor" stroke-width="2.65"/><path d="M-25 136c188-44 284 79 435 4s263-89 395-10 264 22 440-70" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g class="ribbon-fine"><path d="M-22 119C144 62 250 155 399 84s276-48 406 23 238 41 423-54" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M-7 143C166 75 265 181 419 115s249-85 390-4 251 18 412-73" fill="none" stroke="currentColor" stroke-width=".95"/><path d="M8 98c162 90 285-86 419-10s272 88 395-11 258-53 397-12" fill="none" stroke="currentColor" stroke-width=".8" opacity=".82"/></g></g></svg>';document.querySelectorAll('[data-ribbon]').forEach(x=>x.innerHTML=wave);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced||!('IntersectionObserver'in window))document.querySelectorAll('.js-reveal').forEach(x=>x.classList.add('in-view'));else{const observer=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in-view');observer.unobserve(x.target)}}),{threshold:.22});document.querySelectorAll('.js-reveal').forEach(x=>observer.observe(x))}})();
</script>
<script>
  document.querySelector('[data-areas]').dataset.count = document.querySelector('[data-areas]').children.length;
