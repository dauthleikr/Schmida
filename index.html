<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verhaltenstherapie für Erwachsene und Biofeedback bei Carina Schmida.">
  <link rel="icon" type="image/png" href="assets/icon4_tiny.png" data-site-icon>
  <link rel="apple-touch-icon" href="assets/icon4_tiny.png" data-site-icon>
  <title>Carina Schmida – Psychotherapie</title>
  <script src="content-model.js"></script>
  <script src="content.js"></script>
  <style>
    :root {
      --wine-950:#291117;
      --wine-850:#471a25;
      --wine-750:#6b2736;
      --wine-650:#863547;
      --header-bg:#291117;
      --ribbon-hot:#9d1c30;
      --rose-300:#dfa8ad;
      --rose-100:#f4e4e4;
      --practice-bg:#f2edeb;
      --paper:#fcfaf8;
      --ink:#2e2929;
      --muted:#716668;
      --body-text:#51474a;
      --intro-text:#471a25;
      --line:#dfd5d2;
      --serif:Georgia,"Times New Roman",serif;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --page:min(1120px,calc(100% - 48px));
      --section-spacing-desktop:104px;
      --section-spacing-mobile:64px;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:84px; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6; }
    a { color:inherit; }
    h1,h2,h3,p { margin-top:0; }
    h1,h2 { font-family:var(--serif); font-weight:400; letter-spacing:0; }
    h2 { max-width:15ch; margin-bottom:24px; font-size:var(--section-title-size,clamp(2.35rem,5vw,4.35rem)); line-height:.99; }
    p { color:var(--body-text); }
    .page { width:var(--page); margin:0 auto; }
    .eyebrow { margin:0 0 15px; color:var(--wine-650); font-size:.7rem; font-weight:700; letter-spacing:.12em; line-height:1.3; text-transform:uppercase; }

    .site-header { position:sticky; z-index:20; top:0; border-bottom:1px solid rgba(255,255,255,.16); background:var(--header-bg); color:#fff; }
    .header-inner { display:flex; align-items:center; justify-content:space-between; min-height:74px; gap:22px; }
    .brand { display:inline-flex; align-items:center; gap:10px; color:#fff; font-family:var(--serif); font-size:1.05rem; font-weight:500; line-height:1; text-decoration:none; white-space:nowrap; }
    .brand-mark { display:block; width:32px; height:32px; object-fit:contain; }
    .brand-mark[hidden] { display:none; }
    .nav-list { display:flex; align-items:center; gap:clamp(14px,2.1vw,28px); margin:0; padding:0; list-style:none; }
    .nav-list a { position:relative; color:rgba(255,255,255,.88); font-size:.77rem; font-weight:650; letter-spacing:.03em; text-decoration:none; transition:color 180ms ease; }
    .nav-list a::after { position:absolute; right:0; bottom:-8px; left:0; height:1px; background:var(--rose-300); content:""; transform:scaleX(0); transform-origin:right; transition:transform 200ms cubic-bezier(.16,1,.3,1); }
    .nav-list a:hover,.nav-list a:focus-visible { color:var(--rose-300); }
    .nav-list a:hover::after,.nav-list a:focus-visible::after { transform:scaleX(1); transform-origin:left; }
    .menu-toggle { display:none; border:1px solid rgba(255,255,255,.34); background:transparent; color:#fff; font:inherit; padding:8px 10px; }

    .hero { --hero-content-top:clamp(20px,2vw,32px); --hero-ribbon-height:211px; --hero-title-size:clamp(3.35rem,7vw,6.75rem); --hero-title-width-desktop:42%; position:relative; overflow:hidden; background:var(--wine-950); color:#fff; }
    .hero[data-title-size="tiny"] { --hero-title-size:clamp(2.2rem,4vw,3.9rem); }
    .hero[data-title-size="small"] { --hero-title-size:clamp(2.6rem,4.7vw,4.6rem); }
    .hero[data-title-size="compact"] { --hero-title-size:clamp(3rem,5.5vw,5.4rem); }
    .hero[data-title-size="large"] { --hero-title-size:clamp(3.6rem,8.2vw,7.7rem); }
    .hero-inner { position:relative; z-index:2; display:grid; grid-template-columns:minmax(0,var(--hero-title-width-desktop)) minmax(330px,1fr); align-items:start; gap:6vw; padding-bottom:var(--hero-ribbon-height); }
    .hero-copy { position:relative; z-index:4; align-self:center; padding:clamp(64px,8vw,112px) 0; }
    .hero .eyebrow { margin-bottom:var(--hero-eyebrow-title-spacing-desktop,15px); color:var(--rose-300); }
    h1 { width:100%; max-width:none; margin-bottom:26px; font-size:var(--hero-title-size); line-height:.9; }
    .hero-statement { max-width:43ch; margin:0; color:rgba(255,255,255,.98); font-size:clamp(1rem,1.4vw,1.14rem); font-weight:500; text-shadow:0 2px 18px rgba(27,0,7,.84); }
    .hero-contact { display:inline-flex; align-items:center; justify-content:center; min-height:42px; margin-top:28px; padding:0 17px; border:1px solid var(--rose-300); color:#fff; font-size:.8rem; font-weight:700; letter-spacing:.03em; text-decoration:none; transition:background 180ms ease,color 180ms ease; }
    .hero-contact:hover,.hero-contact:focus-visible { background:var(--rose-300); color:var(--wine-950); }
    .hero-image-wrap { position:relative; align-self:stretch; min-height:500px; }
    .hero-image-wrap::after { position:absolute; z-index:1; inset:0; background:linear-gradient(90deg,var(--wine-950) 0%,transparent var(--hero-blend-desktop,32%)); content:""; pointer-events:none; }
    .hero-image { display:block; width:100%; height:100%; object-fit:cover; object-position:var(--hero-image-position,center top); filter:saturate(.78) contrast(.93); mix-blend-mode:luminosity; opacity:.96; }
    .hero-ribbon { position:absolute; z-index:3; right:-10vw; bottom:-1px; left:-10vw; height:var(--hero-ribbon-height); color:var(--ribbon-hot); pointer-events:none; }
    .hero[data-image-blend="natural"] .hero-image { filter:saturate(.92) contrast(.98); mix-blend-mode:normal; opacity:1; }
    .hero[data-image-blend="mono"] .hero-image { filter:grayscale(1) contrast(1.08); mix-blend-mode:luminosity; opacity:.92; }
    .hero[data-image-blend="warm"] .hero-image { filter:sepia(.22) saturate(.88) contrast(.95); mix-blend-mode:soft-light; opacity:.96; }
    .hero[data-image-overlay="none"] .hero-image-wrap::after { background:none; }
    .hero[data-image-overlay="strong"] .hero-image-wrap::after { background:linear-gradient(90deg,var(--wine-950) 0%,var(--wine-950),transparent var(--hero-blend-desktop,32%)); }
    .hero[data-image-layout="background"] .hero-inner { display:block; }
    .hero[data-image-layout="background"] .hero-image-wrap { position:absolute; z-index:0; top:0; bottom:0; left:50%; width:100vw; min-height:0; transform:translateX(-50%); }
    .hero[data-image-layout="background"] .hero-copy { display:flex; min-height:inherit; max-width:650px; flex-direction:column; justify-content:center; }

    .content-sections { position:relative; z-index:4; margin-top:-3px; }
    .content-section + .content-section { margin-top:-2px; }
    body.section-preview .site-header,body.section-preview .hero,body.section-preview .footer-band,body.section-preview .ribbons { display:none; }
    body.section-preview .content-sections { margin-top:0; }
    body.section-preview .dynamic-section { min-height:100vh; }
    .section { position:relative; padding:var(--section-spacing-desktop) 0; }
    .dynamic-section { background:var(--section-bg,var(--paper)); }
    .dynamic-section .eyebrow { margin-bottom:15px; font-size:1.07rem; }
    .dynamic-section .section-heading-accent { color:var(--wine-650); }
    .dynamic-section .section-intro-text { color:var(--intro-text); }
    .section-heading-mobile { display:none; }
    .dynamic-section.is-dark { color:#fff; }
    .dynamic-section.is-dark p { color:rgba(255,255,255,.74); }
    .dynamic-section.is-dark .eyebrow { color:var(--rose-300); }
    .dynamic-section.is-dark .section-heading-accent { color:var(--rose-300); }
    .dynamic-section.is-dark h3,.dynamic-section.is-dark .price-name { color:#fff; }
    .dynamic-section.is-dark .price-list,.dynamic-section.is-dark .price-row,.dynamic-section.is-dark .focus-grid,.dynamic-section.is-dark .focus-card { border-color:rgba(255,255,255,.22); }
    .dynamic-section[data-title-size="tiny"] { --section-title-size:clamp(1.7rem,3.1vw,2.65rem); }
    .dynamic-section[data-title-size="small"] { --section-title-size:clamp(1.9rem,3.6vw,3.05rem); }
    .dynamic-section[data-title-size="compact"] { --section-title-size:clamp(2.05rem,4.1vw,3.55rem); }
    .dynamic-section[data-title-size="large"] { --section-title-size:clamp(2.7rem,5.8vw,5.15rem); }

    .intro-grid { display:grid; grid-template-columns:.82fr 1.18fr; gap:clamp(42px,10vw,150px); align-items:start; }
    .intro-grid p { max-width:55ch; margin-bottom:29px; font-size:1.07rem; }
    .intro-heading .intro-lead { max-width:38ch; margin:-5px 0 0; font-size:1rem; line-height:1.65; }
    .bullet-list { display:grid; gap:15px; margin:0; padding:0; list-style:none; }
    .bullet-list li { display:flex; gap:13px; align-items:flex-start; font-weight:550; }
    .bullet-list li::before { width:8px; height:8px; flex:0 0 auto; margin-top:.6em; border-radius:50%; background:var(--wine-650); content:""; }

    .therapy-grid { display:grid; grid-template-columns:1fr .9fr; gap:clamp(46px,11vw,155px); align-items:center; }
    .therapy-copy>p { max-width:54ch; font-size:1.05rem; }
    .therapy-note { padding:30px 0 30px 29px; border-left:2px solid var(--wine-650); color:var(--wine-850); font-family:var(--serif); font-size:clamp(1.32rem,2.1vw,1.8rem); line-height:1.28; }
    .is-dark .therapy-note { border-color:var(--rose-300); color:#fff; }

    .focus-header { display:grid; grid-template-columns:.8fr 1.2fr; gap:8vw; margin-bottom:56px; }
    .focus-header h2 { margin:0; }
    .focus-header p { align-self:end; max-width:45ch; margin:0; }
    .focus-grid { display:grid; grid-template-columns:repeat(var(--card-columns,4),1fr); border-top:1px solid var(--line); }
    .focus-card { min-height:240px; padding:27px 28px 23px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .focus-card.is-row-start { padding-left:0; }
    .focus-card.is-row-end { border-right:0; }
    .focus-card h3 { max-width:12ch; margin-bottom:16px; color:var(--wine-850); font-family:var(--serif); font-size:1.55rem; font-weight:400; line-height:1.04; }
    .focus-card p { margin:0; font-size:.91rem; }
    .layout-title-cards .focus-header { margin-bottom:40px; }
    .focus-card.title-card { display:flex; min-height:104px; align-items:center; padding-top:24px; padding-bottom:24px; }
    .focus-card.title-card h3 { max-width:18ch; margin-bottom:0; font-family:var(--title-card-font,var(--serif)); font-size:var(--title-card-size,1.55rem); }
    .title-cards-footer { max-width:45ch; margin:32px 0 0; }

    .practice-grid { display:grid; grid-template-columns:.82fr 1.18fr; gap:clamp(46px,10vw,135px); align-items:center; }
    .practice-copy p { max-width:38ch; font-size:1.05rem; }
    .office-placeholder { position:relative; min-height:430px; overflow:hidden; background:#d7cbc7; }
    .office-placeholder::before { position:absolute; inset:0; background:linear-gradient(125deg,rgba(93,48,47,.88),rgba(93,48,47,.06) 55%),linear-gradient(0deg,rgba(255,255,255,.17),transparent); content:""; }
    .office-art { position:absolute; right:10%; bottom:0; left:10%; height:70%; border:14px solid rgba(255,255,255,.63); border-bottom:0; }
    .office-art::before { position:absolute; bottom:0; left:12%; width:46%; height:72%; border-radius:90px 90px 0 0; background:rgba(245,235,229,.85); box-shadow:150px 21px 0 -25px rgba(77,35,40,.67); content:""; }
    .office-art::after { position:absolute; right:-8%; bottom:30%; width:52%; height:8px; background:rgba(75,36,43,.62); box-shadow:0 72px 0 rgba(75,36,43,.62); content:""; }
    .section-image { display:block; width:100%; min-height:430px; max-height:620px; object-fit:cover; object-position:var(--section-image-position,center center); }
    .image-caption { position:absolute; z-index:1; right:18px; bottom:15px; margin:0; color:#fff!important; font-size:.67rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

    .wide-image-copy { max-width:760px; margin-bottom:clamp(36px,4.5vw,54px); }
    .wide-image-copy h2 { margin-bottom:22px; }
    .wide-image-copy>p { max-width:56ch; margin:0; }
    .wide-image-frame { position:relative; isolation:isolate; width:100%; min-height:0; overflow:hidden; background:#d7cbc7; }
    .wide-image-frame::before { content:none; }
    .wide-image-frame .section-image { position:relative; z-index:1; width:100%; height:auto; min-height:0; max-height:none; object-fit:contain; }
    .wide-image-frame .image-caption { z-index:2; }
    .wide-image-carousel { position:relative; }
    .carousel-stage { position:relative; touch-action:pan-y; user-select:none; }
    .carousel-stage .section-image { -webkit-user-drag:none; }
    .carousel-slide { position:absolute; top:0; left:50%; opacity:0; visibility:hidden; pointer-events:none; transform:translateX(-50%); transition:opacity .55s ease,visibility 0s linear .55s; }
    .carousel-slide[data-active="true"] { position:relative; z-index:1; left:auto; opacity:1; visibility:visible; pointer-events:auto; transform:none; transition-delay:0s; }
    .carousel-controls { display:flex; min-height:44px; align-items:center; justify-content:center; gap:12px; margin-top:clamp(30px,4vw,48px); }
    .carousel-arrow,.carousel-dots button { border:1px solid rgba(71,26,37,.28); background:rgba(255,255,255,.45); color:var(--wine-850); cursor:pointer; }
    .carousel-arrow { display:grid; width:44px; height:44px; place-items:center; border-radius:50%; font-size:1.2rem; line-height:1; }
    .carousel-arrow:hover,.carousel-dots button:hover { border-color:var(--wine-650); color:var(--wine-650); }
    .carousel-arrow:focus-visible,.carousel-dots button:focus-visible { outline:3px solid var(--rose-300); outline-offset:3px; }
    .carousel-dots { display:flex; align-items:center; gap:8px; padding:0 4px; }
    .carousel-dots button { width:9px; height:9px; padding:0; border:0; border-radius:50%; background:rgba(71,26,37,.28); }
    .carousel-dots button[data-active="true"] { width:24px; border-radius:999px; background:var(--wine-650); }
    .is-dark .carousel-arrow { border-color:rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; }
    .is-dark .carousel-dots button { background:rgba(255,255,255,.35); }
    .is-dark .carousel-dots button[data-active="true"] { background:var(--rose-300); }

    .layout-wide-image[data-image-style="offset-shadow"] .wide-image-frame {
      width:100%;
      overflow:visible;
      background:transparent;
    }
    .layout-wide-image[data-image-style="offset-shadow"] .section-image {
      box-shadow:0 34px 72px rgba(20,16,17,.38),0 11px 26px rgba(20,16,17,.24),0 2px 6px rgba(20,16,17,.18);
    }

    .layout-wide-image[data-image-style="square-stage"] .wide-image-frame {
      --image-offset:clamp(14px,2vw,22px);
      width:min(calc(100% - var(--image-offset)),680px);
      min-height:0;
      margin:0 auto var(--image-offset);
      overflow:visible;
      aspect-ratio:1;
      background:var(--rose-100);
    }
    .layout-wide-image[data-image-style="square-stage"] .wide-image-frame::before {
      position:absolute;
      z-index:0;
      inset:0;
      display:block;
      border:1px solid rgba(255,255,255,.32);
      background:var(--wine-650);
      box-shadow:0 24px 48px rgba(41,17,23,.16);
      content:"";
      transform:translate(calc(-1 * var(--image-offset)),var(--image-offset));
    }
    .layout-wide-image[data-image-style="square-stage"] .section-image {
      position:absolute;
      top:50%;
      left:50%;
      width:calc(100% - clamp(28px,5vw,56px));
      height:auto;
      max-height:calc(100% - clamp(28px,5vw,56px));
      object-fit:contain;
      box-shadow:0 10px 28px rgba(41,17,23,.16);
      transform:translate(-50%,-50%);
    }

    .layout-wide-image[data-image-style="gallery-frame"] .wide-image-frame {
      width:min(100%,960px);
      min-height:0;
      margin-inline:auto;
      padding:clamp(12px,2vw,24px);
      border:1px solid var(--line);
      background:var(--paper);
      box-shadow:0 18px 50px rgba(41,17,23,.12);
    }
    .layout-wide-image.is-dark[data-image-style="gallery-frame"] .wide-image-frame {
      border-color:rgba(255,255,255,.22);
      background:rgba(255,255,255,.1);
    }
    .layout-wide-image.is-dark[data-image-style="square-stage"] .wide-image-frame::before {
      background:var(--rose-300);
    }

    .topics-grid { display:grid; grid-template-columns:.72fr 1.28fr; gap:clamp(48px,10vw,148px); align-items:start; }
    .topics-copy>p { max-width:39ch; }
    .topics-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 38px; margin:5px 0 0; padding:0; list-style:none; }
    .topics-list li { display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; align-items:start; padding:19px 0; border-top:1px solid var(--line); color:var(--wine-850); font-family:var(--serif); font-size:1.22rem; line-height:1.22; }
    .topics-list li span { padding-top:.18em; color:var(--wine-650); font-family:var(--sans); font-size:.62rem; font-weight:750; letter-spacing:.1em; }
    .is-dark .topics-list li { border-color:rgba(255,255,255,.22); color:#fff; }
    .is-dark .topics-list li span { color:var(--rose-300); }

    .costs-grid { display:grid; grid-template-columns:.78fr 1.22fr; gap:clamp(46px,11vw,150px); }
    .costs-copy p { max-width:35ch; }
    .price-list { border-top:1px solid var(--line); }
    .price-row { display:grid; grid-template-columns:1fr auto; gap:20px; padding:22px 0; border-bottom:1px solid var(--line); }
    .price-name { display:grid; gap:2px; color:var(--wine-850); font-family:var(--serif); font-size:1.25rem; }
    .price-duration { color:var(--muted); font-family:var(--sans); font-size:.8rem; }
    .is-dark .price-duration { color:rgba(255,255,255,.68); }
    .price-value { align-self:center; font-size:.86rem; font-weight:700; white-space:nowrap; }
    .reimbursement { max-width:53ch; margin:25px 0 0; font-size:.89rem; }

    .conditions-grid { display:grid; grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr); gap:clamp(52px,9vw,128px); align-items:start; }
    .conditions-copy,.conditions-details { min-width:0; }
    .conditions-copy>p { max-width:38ch; }
    .conditions-details { border-top:1px solid var(--line); }
    .conditions-highlight { display:flex; width:min(100%,390px); align-items:flex-start; flex-direction:column; justify-content:center; margin-top:clamp(36px,5vw,58px); padding:var(--conditions-highlight-padding-top,32px) clamp(28px,4vw,42px) var(--conditions-highlight-padding-bottom,32px); border:1px solid var(--conditions-highlight-border); color:var(--conditions-highlight-ink); text-align:left; background:linear-gradient(135deg,var(--conditions-highlight-start),var(--conditions-highlight-end)); }
    .conditions-highlight-centered { align-items:center; text-align:center; }
    .conditions-highlight>div { width:100%; }
    .conditions-highlight-label { margin:0 0 clamp(26px,3vw,38px); color:inherit; font-size:.68rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
    .conditions-highlight-text { margin:0; color:var(--wine-650); font-family:var(--serif); font-size:var(--conditions-highlight-size); line-height:.96; }
    .conditions-highlight-detail { width:100%; max-width:none; margin:18px 0 0; color:inherit; font-size:.9rem; line-height:1.65; opacity:.76; }
    .conditions-list { display:grid; }
    .condition-item { min-width:0; padding:25px 0 27px; border-bottom:1px solid var(--line); }
    .condition-item h3 { margin:0 0 9px; color:var(--wine-850); font-family:var(--serif); font-size:1.16rem; font-weight:400; line-height:1.28; }
    .condition-item p { margin:0; font-size:.9rem; line-height:1.7; }
    .conditions-note { max-width:58ch; margin:24px 0 0; font-size:.86rem; }
    .layout-conditions.is-dark .conditions-details,.layout-conditions.is-dark .condition-item { border-color:rgba(255,255,255,.22); }
    .layout-conditions.is-dark .condition-item h3 { color:#fff; }

    .contact-section { overflow:hidden; padding-bottom:0; }
    .contact-section h2 { max-width:11ch; }
    .contact-grid { padding-bottom:clamp(70px,10vw,120px); }
    .contact-copy { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(42px,8vw,100px); align-items:start; margin-bottom:clamp(48px,7vw,80px); }
    .contact-copy>p { max-width:43ch; margin-top:10px; }
    .contact-details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(42px,8vw,100px); }
    .contact-group { padding-top:24px; border-top:1px solid var(--line); }
    .is-dark .contact-group { border-color:rgba(255,255,255,.2); }
    .contact-group h3 { margin:0 0 30px; color:inherit; font-family:var(--serif); font-size:clamp(1.55rem,2.4vw,2rem); font-weight:400; line-height:1.15; }
    .contact-group-items { display:grid; gap:26px; }
    .detail-label { margin-bottom:8px; color:var(--wine-650); font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .is-dark .detail-label { color:var(--rose-300); }
    .detail-value { margin:0; color:inherit; font-family:var(--serif); font-size:1.23rem; line-height:1.35; text-decoration:none; }
    .detail-value-address { display:inline-block; }
    .detail-value:hover { color:var(--wine-650); }
    .is-dark .detail-value:hover { color:var(--rose-300); }
    .map { position:relative; display:flex; min-height:280px; align-items:flex-end; overflow:hidden; background:#39161e; }
    .map::before,.map::after { position:absolute; content:""; pointer-events:none; }
    .map::before { inset:-20%; opacity:.42; background:repeating-linear-gradient(31deg,transparent 0 23px,#b9767d 24px 27px,transparent 28px 66px),repeating-linear-gradient(124deg,transparent 0 27px,#9a565f 28px 30px,transparent 31px 83px); transform:rotate(-6deg); }
    .map::after { z-index:1; top:47%; left:55%; width:16px; height:16px; border:4px solid var(--rose-300); border-radius:50% 50% 50% 0; background:var(--wine-650); transform:rotate(-45deg); }
    .map-link { position:relative; z-index:2; margin:0 0 26px 26px; color:#fff; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; }
    .map-link::after { display:inline-block; margin-left:8px; content:"→"; }
    .map-link:hover { color:var(--rose-300); }
    .map-embed { min-height:clamp(360px,38vw,480px); align-items:stretch; }
    .map-embed::before,.map-embed::after { display:none; }
    .map-embed iframe { display:block; width:100%; min-height:clamp(360px,38vw,480px); border:0; }
    .map-embed .map-link { position:absolute; z-index:2; bottom:22px; left:22px; margin:0; padding:10px 14px; border:1px solid rgba(255,255,255,.18); border-radius:3px; background:rgba(41,17,23,.9); box-shadow:0 8px 24px rgba(0,0,0,.24); }

    .ribbons { position:relative; height:clamp(126px,17vw,210px); overflow:hidden; isolation:isolate; color:var(--ribbon-hot); background:var(--divider-top,var(--paper)); }
    .ribbons::after,.hero-ribbon::after { position:absolute; z-index:2; right:0; bottom:-2px; left:0; height:4px; background:var(--divider-bottom,var(--paper)); content:""; }
    .ribbons svg,.hero-ribbon svg { width:100%; height:100%; overflow:visible; }
    .ribbon-transition { position:absolute; z-index:0; inset:0; width:100%; height:100%; overflow:visible; }
    .ribbon-transition-bottom { fill:var(--divider-bottom,var(--paper)); }
    .ribbon-transition-soft { fill:none; stroke:var(--divider-bottom,var(--paper)); stroke-width:28; opacity:.22; filter:blur(8px); }
    .ribbons>svg:not(.ribbon-transition),.hero-ribbon>svg:not(.ribbon-transition) { position:relative; z-index:1; }
    .ribbon-lines { opacity:0; transform-box:fill-box; transform-origin:center; will-change:transform,opacity,filter; }
    .ribbons.in-view .ribbon-lines { animation:ribbon-arrive 1850ms cubic-bezier(.16,1,.3,1) both; }
    .ribbon-glow,.ribbon-primary,.ribbon-fine { transform-box:fill-box; transform-origin:center; }
    .hero-ribbon .ribbon-lines { opacity:.92; }
    .hero-ribbon .ribbon-glow { opacity:.72; }
    .hero-ribbon .ribbon-primary { opacity:1; }
    .hero-ribbon .ribbon-fine { opacity:.82; }
    @keyframes ribbon-arrive {
      0% { opacity:0; transform:translate3d(-14%,18px,0) rotate(-.8deg) scale(1.05); filter:blur(8px); }
      40%,100% { opacity:1; }
      100% { transform:none; filter:blur(0); }
    }

    .footer-band { background:var(--wine-950); }
    .site-footer { display:flex; align-items:center; justify-content:space-between; min-height:83px; color:rgba(255,255,255,.6); font-size:.72rem; }

    @media (max-width:900px) {
      :root { --page:min(100% - 40px,1120px); }
      .section-heading-desktop { display:none; }
      .section-heading-mobile { display:block; }
      .section { padding:var(--section-spacing-mobile) 0; }
      .site-header,.header-inner { min-height:65px; }
      .menu-toggle { display:inline-flex; }
      .nav-list { position:absolute; top:65px; right:0; left:0; display:none; flex-direction:column; align-items:stretch; gap:0; padding:10px 20px 17px; border-bottom:1px solid rgba(255,255,255,.16); background:var(--wine-950); }
      .nav-list.is-open { display:flex; }
      .nav-list a { display:block; padding:11px 0; }
      .hero { --mobile-wave-height:clamp(96px,27vw,118px); --hero-ribbon-height:var(--mobile-wave-height); }
      .hero .eyebrow { margin-bottom:var(--hero-eyebrow-title-spacing-mobile,15px); }
      .hero-inner,.intro-grid,.therapy-grid,.practice-grid,.costs-grid,.conditions-grid,.focus-header,.topics-grid,.timeline-grid,.contact-copy { grid-template-columns:minmax(0,1fr); }
      .intro-grid,.therapy-grid,.practice-grid,.costs-grid,.conditions-grid,.topics-grid,.timeline-grid,.contact-copy { gap:36px; }
      .hero-inner { gap:0; padding:var(--hero-content-top) 0 0; }
      .hero-copy { padding:0 0 52px; transform:none; }
      h1 { width:auto; max-width:11ch; }
      .hero[data-mobile-image-layout="portrait"] .hero-inner,.hero[data-mobile-image-layout="landscape"] .hero-inner { display:grid; grid-template-columns:minmax(0,1fr); }
      .hero[data-mobile-image-layout="portrait"] .hero-copy,.hero[data-mobile-image-layout="landscape"] .hero-copy { display:block; min-height:0; }
      .hero[data-mobile-image-layout="portrait"] .hero-image-wrap,.hero[data-mobile-image-layout="landscape"] .hero-image-wrap { position:relative; inset:auto; left:-20px; width:100vw; min-height:0; justify-self:start; margin:0; transform:none; }
      .hero[data-mobile-image-layout="hidden"] .hero-image-wrap { display:none; }
      .hero[data-mobile-image-layout="hidden"] .hero-copy { padding-bottom:calc(var(--mobile-wave-height) + 54px); }
      .hero-image { height:auto; object-fit:contain; object-position:center center; }
      .hero[data-image-overlay="soft"] .hero-image-wrap::after { background:linear-gradient(180deg,var(--wine-950) 0%,transparent var(--hero-blend-mobile,28%)); }
      .hero[data-image-overlay="strong"] .hero-image-wrap::after { background:linear-gradient(180deg,var(--wine-950) 0%,var(--wine-950),transparent var(--hero-blend-mobile,28%)); }
      .hero-ribbon { right:0; bottom:0; left:0; height:var(--mobile-wave-height); }
      .hero[data-mobile-image-layout="hidden"] .hero-copy { min-height:inherit; }
      .focus-header { gap:18px; margin-bottom:38px; }
      .title-cards-footer { margin-top:28px; }
      .focus-grid { grid-template-columns:repeat(2,1fr); }
      .focus-card { min-height:190px; padding-left:0; }
      .focus-card:nth-child(odd) { border-right:1px solid var(--line); }
      .focus-card:nth-child(even) { padding-left:22px; border-right:0; }
      .therapy-note { padding:24px 0 0; border-top:2px solid var(--wine-650); border-left:0; }
      .is-dark .therapy-note { border-color:var(--rose-300); }
      .price-row { grid-template-columns:minmax(0,1fr) auto; }
      .price-name { min-width:0; }
      .price-value { max-width:18ch; text-align:right; white-space:normal; }
      .contact-details { gap:36px; }
      .office-placeholder,.section-image { min-height:360px; }
      .wide-image-copy { margin-bottom:36px; }
      .wide-image-frame { min-height:0; }
      .layout-wide-image[data-image-style="square-stage"] .wide-image-frame { --image-offset:10px; }
      .carousel-controls { flex-wrap:wrap; gap:9px; margin-top:28px; }
      .carousel-arrow { width:42px; height:42px; }
      .topics-list { gap:0 24px; }
      .map { min-height:240px; }
      .map-embed,.map-embed iframe { min-height:330px; }
      .ribbons { height:clamp(88px,24vw,108px); }
      .ribbons svg,.hero-ribbon svg { width:220%; max-width:none; }
      .ribbon-transition { right:auto; left:-60%; width:220%; }
      .ribbons>svg:not(.ribbon-transition),.hero-ribbon>svg:not(.ribbon-transition) { left:-60%; }
    }

    @media (min-width:901px) {
      .hero[data-image-layout="landscape"] .hero-inner {
        grid-template-columns:minmax(220px,var(--hero-title-width-desktop)) minmax(0,1fr);
        gap:clamp(32px,5vw,72px);
      }

      .hero[data-image-layout="landscape"] .hero-copy {
        align-self:start;
        padding:var(--hero-content-top) 0 0;
      }

      .hero[data-image-layout="landscape"] .hero-ribbon {
        bottom:0;
      }

      .hero[data-image-layout="landscape"] .hero-image-wrap {
        width:calc(100% + max(24px,calc((100vw - 1120px)/2)));
        min-height:0;
        align-self:end;
        margin-bottom:calc(-1 * var(--hero-ribbon-height));
      }

      .hero[data-image-layout="landscape"] .hero-image {
        height:auto;
        object-fit:contain;
      }
    }

    @media (max-width:440px) {
      :root { --page:min(100% - 32px,1120px); }
      .hero[data-mobile-image-layout="portrait"] .hero-image-wrap,.hero[data-mobile-image-layout="landscape"] .hero-image-wrap { left:-16px; }
      .brand { font-size:.93rem; }
      .hero { --hero-title-size:clamp(3rem,14vw,4.3rem); }
      .hero[data-title-size="tiny"] { --hero-title-size:clamp(2rem,9.5vw,2.75rem); }
      .hero[data-title-size="small"] { --hero-title-size:clamp(2.3rem,10.5vw,3.15rem); }
      .hero[data-title-size="compact"] { --hero-title-size:clamp(2.7rem,12vw,3.75rem); }
      .hero[data-title-size="large"] { --hero-title-size:clamp(3.25rem,15.5vw,4.8rem); }
      .dynamic-section { --section-title-size:clamp(2.2rem,12vw,3.15rem); }
      .dynamic-section[data-title-size="tiny"] { --section-title-size:clamp(1.55rem,8.5vw,2.2rem); }
      .dynamic-section[data-title-size="small"] { --section-title-size:clamp(1.75rem,9.5vw,2.45rem); }
      .dynamic-section[data-title-size="compact"] { --section-title-size:clamp(1.95rem,10.5vw,2.75rem); }
      .dynamic-section[data-title-size="large"] { --section-title-size:clamp(2.45rem,13.4vw,3.55rem); }
      .focus-grid { grid-template-columns:1fr; }
      .focus-card,.focus-card:nth-child(even),.focus-card:nth-child(odd) { min-height:auto; padding:25px 0; border-right:0; }
      .price-row { grid-template-columns:1fr; gap:6px; }
      .price-value { max-width:none; text-align:left; }
      .conditions-highlight { margin-top:32px; padding-right:26px; padding-left:26px; }
      .dynamic-section.layout-conditions { --section-title-size:clamp(1.9rem,9.3vw,2.45rem); }
      .contact-details { grid-template-columns:1fr; }
      .topics-list { grid-template-columns:1fr; }
      .map-link { margin-right:24px; }
      .site-footer { align-items:flex-start; flex-direction:column; justify-content:center; gap:8px; }
    }

    body[data-preview-viewport="desktop"] .section-heading-desktop { display:block; }
    body[data-preview-viewport="desktop"] .section-heading-mobile { display:none; }
    body[data-preview-viewport="mobile"] .section-heading-desktop { display:none; }
    body[data-preview-viewport="mobile"] .section-heading-mobile { display:block; }

    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      .ribbon-lines { animation:none!important; filter:none!important; opacity:.85; transform:none; }
    }
  </style>
  <link rel="stylesheet" href="listing-styles.css">
  <link rel="stylesheet" href="timeline-styles.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="#home" aria-label="Zur Startseite">
        <img class="brand-mark" src="assets/icon4_tiny.png" alt="" aria-hidden="true">
        <span data-practice-name></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menü</button>
      <nav id="site-navigation" aria-label="Hauptnavigation"><ul class="nav-list"></ul></nav>
    </div>
  </header>
  <main>
    <section class="hero" id="home">
      <div class="page hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-hero-field="eyebrow"></p>
          <h1 data-hero-field="title"></h1>
          <p class="hero-statement" data-hero-field="sentence"></p>
          <a class="hero-contact" href="#" data-hero-field="contactButton"></a>
        </div>
        <div class="hero-image-wrap"><img class="hero-image" src="assets/carina_close2.JPG" alt=""></div>
      </div>
      <div class="hero-ribbon"></div>
    </section>
    <div class="content-sections" id="content-sections"></div>
  </main>
  <div class="footer-band"><footer class="page site-footer"><span data-footer-copyright></span></footer></div>
  <script>
    (() => {
      let source = window.practiceContent;
      const searchParams = new URLSearchParams(location.search);
      if (searchParams.has('sectionPreview')) document.body.classList.add('section-preview');
      if (['desktop','mobile'].includes(searchParams.get('previewViewport'))) document.body.dataset.previewViewport = searchParams.get('previewViewport');
      try {
        if (searchParams.has('preview')) {
          source = JSON.parse(sessionStorage.getItem('practice-preview-content')) || source;
        }
      } catch {}
      const content = window.practiceContentModel.normalize(source);
      window.currentPracticeContent = content;
      const format = (value) => String(value ?? '')
        .replace(/[&<>"']/g, (character) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[character]))
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/_([^_]+)_/g,'<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/\n/g,'<br>');
      const palette = { ...window.practiceContentModel.themes[content.colorTheme], ...content.customColors };
      Object.entries(palette).forEach(([token,value]) => {
        if (token.startsWith('--')) document.documentElement.style.setProperty(token,value);
      });
      document.documentElement.style.setProperty('--section-spacing-desktop',`${content.sectionSpacing.desktop}px`);
      document.documentElement.style.setProperty('--section-spacing-mobile',`${content.sectionSpacing.mobile}px`);
      document.title = content.practiceName;
      document.querySelector('[data-practice-name]').textContent = content.practiceName;
      const brandMark = document.querySelector('.brand-mark');
      brandMark.src = content.siteIcon;
      brandMark.hidden = !content.showHeaderIcon;
      document.querySelectorAll('[data-site-icon]').forEach((link) => { link.href = content.siteIcon; });
      document.querySelectorAll('[data-hero-field]').forEach((element) => { element.innerHTML = format(content.hero[element.dataset.heroField]); });
      document.querySelector('[data-footer-copyright]').textContent = content.footer.copyright;
      const hero = document.querySelector('.hero');
      const image = document.querySelector('.hero-image');
      hero.dataset.titleSize = content.hero.titleSize;
      hero.dataset.imageLayout = content.heroImage.layout;
      hero.dataset.mobileImageLayout = content.heroImage.mobileLayout;
      hero.dataset.imageBlend = content.heroImage.blend;
      hero.dataset.imageOverlay = content.heroImage.overlay;
      hero.style.setProperty('--hero-eyebrow-title-spacing-desktop',`${content.hero.eyebrowTitleSpacingDesktop}px`);
      hero.style.setProperty('--hero-eyebrow-title-spacing-mobile',`${content.hero.eyebrowTitleSpacingMobile}px`);
      hero.style.setProperty('--hero-title-width-desktop',`${content.hero.titleWidthDesktop}%`);
      hero.style.setProperty('--hero-image-position',content.heroImage.position);
      hero.style.setProperty('--hero-mobile-image-position',content.heroImage.mobilePosition);
      hero.style.setProperty('--hero-blend-desktop',`${content.heroImage.blendWidthDesktop}%`);
      hero.style.setProperty('--hero-blend-mobile',`${content.heroImage.blendWidthMobile}%`);
      image.src = content.heroImage.src;
      image.alt = content.heroImage.alt || `Porträt von ${content.practitionerName}`;
    })();
  </script>
  <script src="section-layout.js"></script>
</body>
</html>
