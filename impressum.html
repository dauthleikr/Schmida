<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Impressum und rechtliche Hinweise.">
  <link rel="icon" type="image/png" href="assets/icon4_tiny.png" data-site-icon>
  <link rel="apple-touch-icon" href="assets/icon4_tiny.png" data-site-icon>
  <link rel="stylesheet" href="fonts.css">
  <title>Impressum</title>
  <script src="content-model.js"></script>
  <script src="content.js"></script>
  <style>
    :root {
      --wine-950:#291117;
      --wine-650:#863547;
      --header-bg:#291117;
      --rose-300:#dfa8ad;
      --paper:#fcfaf8;
      --body-text:#51474a;
      --intro-text:#471a25;
      --line:#dfd5d2;
      --serif:Georgia,"Times New Roman",serif;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --page:min(1120px,calc(100% - 48px));
    }
    * { box-sizing:border-box; }
    html { overflow-x:hidden; scroll-behavior:smooth; }
    body { display:flex; min-width:0; min-height:100vh; flex-direction:column; margin:0; overflow-x:hidden; background:var(--paper); color:#2e2929; font-family:var(--sans); font-size:16px; line-height:1.6; }
    a { color:inherit; }
    h1,h2,p { margin-top:0; }
    h1,h2 { font-family:var(--serif); font-weight:400; }
    .page { width:var(--page); max-width:100%; margin:0 auto; }
    .site-header { position:sticky; z-index:2; top:0; border-bottom:1px solid rgba(255,255,255,.16); background:var(--header-bg); color:#fff; }
    .header-inner { display:flex; min-width:0; align-items:center; justify-content:space-between; min-height:74px; gap:22px; }
    .brand { display:inline-flex; min-width:0; align-items:center; gap:10px; color:#fff; font-family:var(--serif); font-size:1.05rem; font-weight:500; line-height:1; text-decoration:none; }
    .brand span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .brand-mark { display:block; width:32px; height:32px; object-fit:contain; }
    .brand-mark[hidden] { display:none; }
    .header-nav { display:flex; flex:0 0 auto; align-items:center; gap:clamp(14px,2.1vw,28px); white-space:nowrap; }
    .header-nav a { color:rgba(255,255,255,.88); font-size:.77rem; font-weight:650; letter-spacing:.03em; text-decoration:none; }
    .header-nav a:hover,.header-nav a:focus-visible { color:var(--rose-300); }
    main { min-width:0; flex:1; overflow-wrap:anywhere; }
    .impressum-main { padding:clamp(38px,6vw,76px) 0 clamp(46px,7vw,84px); }
    .impressum-shell { width:var(--page); min-width:0; max-width:760px; }
    .eyebrow { margin:0 0 15px; color:var(--wine-650); font-size:.7rem; font-weight:700; letter-spacing:.12em; line-height:1.3; text-transform:uppercase; }
    h1 { margin-bottom:18px; color:var(--intro-text); font-size:clamp(3rem,7vw,5.7rem); line-height:.98; }
    .intro { max-width:54ch; margin-bottom:clamp(28px,4vw,48px); color:var(--intro-text); font-family:var(--serif); font-size:clamp(1.25rem,2.2vw,1.65rem); line-height:1.25; }
    .impressum-body { min-width:0; max-width:68ch; padding-top:24px; border-top:1px solid var(--line); }
    .impressum-body p { margin:0 0 1.35rem; color:var(--body-text); }
    .impressum-body strong { display:block; margin:0 0 .45rem; color:var(--intro-text); font-family:var(--serif); font-size:1.35rem; font-weight:400; line-height:1.15; }
    .impressum-body table { display:block; width:100%; max-width:100%; overflow-x:auto; }
    .footer-band { background:var(--wine-950); }
    .site-footer { display:flex; align-items:center; justify-content:space-between; min-height:83px; color:rgba(255,255,255,.6); font-size:.72rem; }
    .footer-links { display:flex; flex-wrap:wrap; gap:10px 18px; }
    .site-footer a { color:rgba(255,255,255,.82); text-underline-offset:3px; }
    .site-footer a:hover,.site-footer a:focus-visible { color:#fff; }
    @media (max-width:600px) {
      :root { --page:min(1120px,calc(100% - 32px)); }
      .header-inner { min-height:65px; }
      .header-nav { gap:14px; }
      .header-nav a { font-size:.7rem; }
      .site-footer { align-items:flex-start; flex-direction:column; justify-content:center; gap:8px; }
    }
    @media (max-width:360px) {
      .brand span { display:none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html" aria-label="Zur Startseite">
        <img class="brand-mark" src="assets/icon4_tiny.png" alt="" aria-hidden="true">
        <span data-practice-name></span>
      </a>
      <nav class="header-nav" aria-label="Seitennavigation">
        <a href="index.html" data-home-link>Startseite</a>
        <a href="index.html#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="impressum-main">
      <div class="page impressum-shell">
        <p class="eyebrow" data-impressum-eyebrow></p>
        <h1 data-impressum-title></h1>
        <p class="intro" data-impressum-intro></p>
        <article class="impressum-body" data-impressum-body></article>
      </div>
    </section>
  </main>
  <div class="footer-band">
    <footer class="page site-footer">
      <span data-footer-copyright></span>
      <nav class="footer-links" aria-label="Seitennavigation"><a href="index.html" data-home-link>Zur Startseite</a><a href="datenschutz.html" data-privacy-link>Datenschutz</a></nav>
    </footer>
  </div>
  <script>
    (() => {
      const content = window.practiceContentModel.normalize(window.practiceContent);
      const impressum = content.impressum;
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[character]));
      const format = (value) => escapeHtml(value)
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/_([^_]+)_/g,'<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/\[([^\]]+)\]\(\/impressum(?:\.html)?\)/gi,'<a href="impressum.html">$1</a>')
        .replace(/\[([^\]]+)\]\(((?:\.{0,2}\/)?[a-z\d][a-z\d._~\/-]*(?:[?#][^\s)]*)?)\)/gi,'<a href="$2">$1</a>')
        .replace(/\n/g,'<br>');
      const formatParagraphs = (value) => String(value ?? '').trim().split(/\r?\n\s*\r?\n/).filter(Boolean).map((paragraph) => `<p>${format(paragraph)}</p>`).join('');
      const palette = { ...window.practiceContentModel.themes[content.colorTheme], ...content.customColors };
      Object.entries(palette).forEach(([token,value]) => { if (token.startsWith('--')) document.documentElement.style.setProperty(token,value); });
      document.title = `${impressum.title} – ${content.practiceName}`;
      document.querySelector('[data-practice-name]').textContent = content.practiceName;
      document.querySelector('[data-impressum-eyebrow]').innerHTML = format(impressum.eyebrow);
      document.querySelector('[data-impressum-title]').textContent = impressum.title;
      document.querySelector('[data-impressum-intro]').innerHTML = format(impressum.intro);
      document.querySelector('[data-impressum-body]').innerHTML = formatParagraphs(impressum.body);
      document.querySelector('[data-footer-copyright]').textContent = content.footer.copyright;
      document.querySelectorAll('[data-home-link]').forEach((link) => { link.textContent = content.navigation.home; });
      const privacyLink = document.querySelector('[data-privacy-link]');
      privacyLink.textContent = content.footer.privacyLabel;
      privacyLink.hidden = !String(content.footer.privacyLabel || '').trim();
      const brandMark = document.querySelector('.brand-mark');
      brandMark.src = content.siteIcon;
      brandMark.hidden = !content.showHeaderIcon;
      document.querySelectorAll('[data-site-icon]').forEach((link) => { link.href = content.siteIcon; });
    })();
  </script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "758ef8a100e843e48eba0e219725cffd"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
