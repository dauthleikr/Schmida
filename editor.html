<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inhalte bearbeiten</title>
  <link rel="stylesheet" href="fonts.css">
  <script src="content-model.js"></script>
  <script src="content.js"></script>
  <style>
    :root {
      --ink:#2e2929;
      --muted:#766b6d;
      --wine:#631028;
      --wine-dark:#32040f;
      --rose:#fff0f3;
      --line:#ebd6dc;
      --paper:#fffafa;
      --danger:#9d1c30;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --serif:Georgia,"Times New Roman",serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    .bar { position:sticky; z-index:10; top:0; border-bottom:1px solid rgba(255,255,255,.18); background:var(--wine-dark); color:#fff; }
    .bar-inner { display:flex; align-items:center; justify-content:space-between; width:min(1240px,calc(100% - 48px)); min-height:74px; margin:auto; gap:22px; }
    .bar h1 { margin:0; font-family:var(--serif); font-size:1.25rem; font-weight:400; }
    .status { display:block; color:#f7ccd7; font-size:.72rem; }
    .header-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .header-action { border:1px solid rgba(255,255,255,.58); background:transparent; color:#fff; padding:9px 11px; font-size:.75rem; font-weight:700; }
    .header-action:hover { background:rgba(255,255,255,.12); }
    .header-action.primary { border-color:#fff; background:#fff; color:var(--wine-dark); }
    .layout { display:grid; grid-template-columns:210px minmax(0,1fr); width:min(1240px,calc(100% - 48px)); margin:auto; }
    .editor-nav { position:sticky; top:74px; align-self:start; padding:38px 28px 40px 0; }
    .editor-nav a { display:block; padding:8px 0; color:var(--muted); font-size:.82rem; text-decoration:none; }
    .editor-nav a:hover { color:var(--wine); }
    .editor-nav-sections { display:grid; margin:2px 0 9px 12px; padding-left:12px; border-left:1px solid var(--line); }
    .editor-nav-sections a { overflow:hidden; padding:5px 0; font-size:.74rem; text-overflow:ellipsis; white-space:nowrap; }
    .editor { min-width:0; padding:38px 0 90px; }
    .editor-panel { padding-bottom:42px; margin-bottom:42px; border-bottom:1px solid var(--line); }
    .panel-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .panel-heading h2 { margin:0 0 5px; color:var(--wine-dark); font-family:var(--serif); font-size:2rem; font-weight:400; }
    .panel-heading p { margin:0; color:var(--muted); font-size:.84rem; }
    .editor-page-link { margin:-8px 0 24px; color:var(--wine); font-size:.8rem; font-weight:700; }
    .editor-page-link a { color:inherit; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .grid-wide { grid-column:1/-1; }
    .field { display:grid; align-content:start; gap:7px; min-width:0; }
    .field>label,.field-label { color:var(--wine-dark); font-size:.76rem; font-weight:750; }
    .field input,.field textarea,.field select { width:100%; border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); padding:10px 11px; }
    .field textarea { min-height:96px; resize:vertical; line-height:1.55; }
    .field input:focus,.field textarea:focus,.field select:focus { outline:2px solid #efa3b7; outline-offset:1px; }
    .field input[type="range"] { accent-color:var(--wine); padding:0; border:0; }
    .field input[type="color"] { height:42px; padding:3px; cursor:pointer; }
    .field .checkbox-field { display:flex; min-height:42px; align-items:center; gap:10px; cursor:pointer; }
    .field .checkbox-field input { width:18px; height:18px; flex:0 0 auto; accent-color:var(--wine); }
    .range-label { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .range-label output { color:var(--wine); font-variant-numeric:tabular-nums; }
    .help { margin:0; color:var(--muted); font-size:.74rem; }
    .toolbar { display:flex; gap:4px; margin-bottom:-3px; }
    .toolbar button { width:30px; height:28px; border:1px solid var(--line); background:#fff; color:var(--wine); font-family:var(--serif); }
    .toolbar button:hover { background:var(--rose); }
    .button { border:1px solid var(--line); background:#fff; color:var(--wine); padding:9px 12px; font-size:.78rem; font-weight:750; }
    .button:hover { background:var(--rose); }
    .button.primary { border-color:var(--wine); background:var(--wine); color:#fff; }
    .button.danger { color:var(--danger); }
    .button:disabled { cursor:not-allowed; opacity:.38; }

    .theme-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .theme-option { position:relative; overflow:hidden; min-height:76px; border:2px solid var(--line); background:#fff; cursor:pointer; }
    .theme-option input { position:absolute; opacity:0; }
    .theme-swatch { display:block; height:42px; background:linear-gradient(135deg,var(--preview-deep) 0 42%,var(--preview-accent) 42% 67%,var(--preview-ribbon) 67%); }
    .theme-label { display:block; padding:7px 8px; color:var(--wine-dark); font-size:.75rem; font-weight:750; }
    .theme-option:has(input:checked) { border-color:var(--wine-dark); box-shadow:0 0 0 2px var(--wine-dark); }
    .color-controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px 18px; margin-top:18px; }
    .color-control { display:grid; grid-template-columns:34px minmax(0,1fr); align-items:center; gap:8px; }
    .color-control label { grid-column:1/-1; color:var(--wine-dark); font-size:.74rem; font-weight:700; }
    .color-control input[type=color] { width:34px; height:34px; padding:0; }

    .hero-settings { padding:18px; border:1px solid var(--line); background:#fff; }
    .section-stack { display:grid; gap:18px; }
    .section-editor { scroll-margin-top:92px; border:1px solid var(--line); background:#fff; box-shadow:0 5px 18px rgba(50,4,15,.04); }
    .section-editor-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line); background:#fdf8f9; }
    .section-title { margin:0; color:var(--wine-dark); font-family:var(--serif); font-size:1.35rem; font-weight:400; }
    .section-meta { margin:3px 0 0; color:var(--muted); font-size:.72rem; }
    .section-actions { display:flex; gap:5px; }
    .icon-button { width:32px; height:32px; border:1px solid var(--line); background:#fff; color:var(--wine); font-size:1rem; }
    .section-preview-button { height:32px; padding:0 9px; border:1px solid var(--wine); background:#fff; color:var(--wine); font-size:.7rem; font-weight:750; }
    .section-preview-button:hover { background:var(--rose); }
    .section-editor-body { padding:18px; }
    .section-editor.is-collapsed .section-editor-head { border-bottom:0; }
    .section-editor.is-collapsed .section-editor-body { display:none; }
    .section-settings { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line); }
    .background-custom { display:grid; grid-template-columns:40px minmax(0,1fr); gap:7px; }
    .background-custom input[type=color] { height:42px; padding:0; }
    .layout-description { grid-column:1/-1; margin:0; color:var(--muted); font-size:.76rem; }
    .section-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .collection { grid-column:1/-1; display:grid; gap:10px; }
    .collection-head { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .collection-head span { color:var(--muted); font-size:.74rem; }
    .collection-list { display:grid; gap:10px; }
    .collection-item { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:10px; padding:13px; border:1px solid var(--line); background:#fdfbfb; }
    .collection-fields { display:grid; grid-template-columns:repeat(var(--item-columns,2),minmax(0,1fr)); gap:12px; }
    .add-section { display:grid; grid-template-columns:minmax(220px,1fr) auto; align-items:end; gap:12px; padding:18px; border:1px dashed #cfaeb7; background:#fff; }
    .empty-sections { padding:28px; border:1px dashed var(--line); color:var(--muted); text-align:center; }
    .footer-actions { display:flex; justify-content:space-between; gap:12px; }

    .preview-modal { width:min(1200px,calc(100% - 32px)); height:min(860px,calc(100% - 32px)); padding:0; border:0; box-shadow:0 30px 100px rgba(18,2,7,.45); }
    .preview-modal::backdrop { background:rgba(28,5,11,.72); }
    .preview-head { display:flex; align-items:center; justify-content:space-between; min-height:56px; padding:0 18px; background:var(--wine-dark); color:#fff; }
    .preview-head h2 { margin:0; font-family:var(--serif); font-size:1.12rem; font-weight:400; }
    .preview-close { width:32px; height:32px; border:0; background:transparent; color:#fff; font-size:1.5rem; }
    .preview-body { display:flex; height:calc(100% - 56px); justify-content:center; overflow:hidden; background:#d9d2d4; }
    .preview-frame { display:block; width:100%; height:100%; border:0; background:#fff; transition:width 180ms ease,box-shadow 180ms ease; }
    .preview-modal[data-viewport="mobile"] .preview-body { padding:18px; }
    .preview-modal[data-viewport="mobile"] .preview-frame { width:390px; max-width:100%; box-shadow:0 8px 34px rgba(34,12,18,.24); }

    @media (max-width:820px) {
      .bar-inner,.layout { width:min(100% - 32px,1240px); }
      .bar-inner { align-items:flex-start; flex-direction:column; padding:14px 0; }
      .header-actions { justify-content:flex-start; }
      .layout { display:block; }
      .editor-nav { display:none; }
      .editor { padding-top:28px; }
      .grid,.section-fields,.section-settings,.theme-options,.color-controls { grid-template-columns:1fr; }
      .section-editor-head { grid-template-columns:1fr; }
      .section-actions { flex-wrap:wrap; }
      .collection-fields { grid-template-columns:1fr; }
      .add-section { grid-template-columns:1fr; }
      .footer-actions { align-items:stretch; flex-direction:column; }
      .preview-modal { width:100%; height:100%; max-width:none; max-height:none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div><h1>Inhalte bearbeiten</h1><span class="status" id="status">Entwurf wird in diesem Browser gespeichert</span></div>
      <div class="header-actions">
        <button class="header-action" type="button" id="connect-content">content.js verbinden</button>
        <button class="header-action" type="button" id="save-content-direct">In content.js speichern</button>
        <button class="header-action" type="button" data-preview-viewport="mobile">Vorschau Mobil</button>
        <button class="header-action" type="button" data-preview-viewport="desktop">Vorschau Desktop</button>
        <button class="header-action primary" type="button" id="download">content.js herunterladen</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav class="editor-nav" aria-label="Editorbereiche">
      <a href="#general">Allgemein</a>
      <a href="#hero-editor">Startseite</a>
      <a href="#sections-editor">Seitenbereiche</a>
      <div class="editor-nav-sections" data-editor-section-nav></div>
      <a href="#footer-editor">Footer</a>
      <a href="#impressum-editor">Impressum</a>
      <a href="#privacy-editor">Datenschutz</a>
    </nav>
    <main class="editor" id="editor">
      <section class="editor-panel" id="general"></section>
      <section class="editor-panel" id="hero-editor"></section>
      <section class="editor-panel" id="sections-editor"></section>
      <section class="editor-panel" id="footer-editor"></section>
      <section class="editor-panel" id="impressum-editor"></section>
      <section class="editor-panel" id="privacy-editor"></section>
      <div class="footer-actions">
        <button class="button danger" type="button" id="reset">Entwurf zurücksetzen</button>
        <button class="button primary" type="button" id="download-bottom">content.js herunterladen</button>
      </div>
    </main>
  </div>
  <dialog class="preview-modal" id="preview-modal">
    <div class="preview-head"><h2>Vorschau</h2><button class="preview-close" type="button" id="close-preview" aria-label="Vorschau schließen">&times;</button></div>
    <div class="preview-body"><iframe class="preview-frame" id="preview-frame" title="Vorschau der Website"></iframe></div>
  </dialog>
  <script src="editor-enhancements.js"></script>
</body>
</html>
